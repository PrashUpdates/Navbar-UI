<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dock">
    <nav class="pill-nav" id="pillNav">
      <button data-name="home" class="active">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        <span class="label">Home</span>
      </button>
      <button data-name="reels">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="3"/><path d="M9 8l6 4-6 4z"/></svg>
        <span class="label">Reels</span>
      </button>
      <button data-name="alerts">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="label">Alerts</span>
      </button>
      <button data-name="people">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="label">People</span>
      </button>
    </nav>

    <div class="fab-wrap">
      <button class="fab" id="fabBtn" aria-label="Create">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="quick-menu" id="quickMenu">
        <div class="qitem">
          <span class="qlabel">Photo</span>
          <span class="qcircle">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          </span>
        </div>
        <div class="qitem">
          <span class="qlabel">Text post</span>
          <span class="qcircle">
            <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
          </span>
        </div>
        <div class="qitem">
          <span class="qlabel">Reel</span>
          <span class="qcircle">
            <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="3"/><path d="M9 8l6 4-6 4z"/></svg>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
